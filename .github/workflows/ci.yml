name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  control-worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control_worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control_worker/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-nexrad.txt
            requirements-mrms-live.txt
            requirements-cloudrun.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile radar_processing/r2.py radar_processing/control.py radar_processing/national_tiles.py radar_processing/era5.py radar_processing/era5_rendering.py scripts/build_national_mrms.py scripts/build_historical_era5.py scripts/run_cloud_run_mrms_live.py scripts/run_cloud_run_mrms_focus.py scripts/run_cloud_run_live.py scripts/run_cloud_run_historical.py cloudrun/admin_service.py
