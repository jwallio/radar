name: Deploy radar application from current main

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static site
        env:
          VITE_BASE_PATH: /
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_RADAR_DATA_BASE_URL: ${{ vars.RADAR_DATA_BASE_URL }}
          VITE_RADAR_CONTROL_API_URL: ${{ vars.RADAR_CONTROL_API_URL }}
        run: npm run build

      - name: Verify this run is still current main
        id: freshness
        shell: bash
        run: |
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "This deployment started from $GITHUB_SHA, but main is now $latest_sha."
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GitHub Pages artifact
        if: steps.freshness.outputs.skip_deploy != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.skip_deploy != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
